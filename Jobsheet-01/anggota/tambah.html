<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>SIMPUS-Mini | Tambah Anggota</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>

  <body>
    <header>
      <h1>Tambah Anggota</h1>

      <nav>
        <ul>
          <li><a href="../index.html">Beranda</a></li>
          <li><a href="../buku/list.html">Daftar Buku</a></li>
          <li><a href="../buku/tambah.html">Tambah Buku</a></li>
          <li><a href="list.html">Daftar Anggota</a></li>
          <li><a href="tambah.html">Tambah Anggota</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section>
        <h2>Form Tambah Anggota</h2>

        <form action="#" method="post">
          <p>
            <label for="id_anggota">ID Anggota:</label><br />
            <input type="text" id="id_anggota" name="id_anggota" required />
          </p>

          <p>
            <label for="nama">Nama Lengkap:</label><br />
            <input type="text" id="nama" name="nama" required />
          </p>

          <p>
            <label for="email">Email:</label><br />
            <input type="email" id="email" name="email" required />
          </p>

          <p>
            <label for="telepon">No. Telepon:</label><br />
            <input type="tel" id="telepon" name="telepon" required />
          </p>

          <p>
            <label for="alamat">Alamat:</label><br />
            <textarea
              id="alamat"
              name="alamat"
              rows="4"
              cols="30"
              required
            ></textarea>
          </p>

          <p>
            <button type="submit">Simpan</button>
            <a href="list.html">Batal</a>
          </p>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 1</p>
    </footer>
  </body>
</html>
